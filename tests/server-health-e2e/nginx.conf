server {
 listen 443 ssl;
 server_name pulsy-e2e;
 ssl_certificate /fixture/ca.crt;
 ssl_certificate_key /fixture/key.pem;
 location ~* ^/api/heartbeat(?:/|$) { access_log off; error_log /dev/null crit; proxy_pass http://server:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
 location /api/ { proxy_pass http://server:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
 location / { proxy_pass http://web:8080; proxy_set_header Host $host; }
}
