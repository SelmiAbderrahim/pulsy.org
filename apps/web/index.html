<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#2563eb" />
		<!-- Localized dashboard titles are injected by privateMetadata before bootstrap. -->
    <title>Pulsy</title>
    <style>
      html[data-locale-pending] #root { display: none; }
      html[data-locale-pending] #locale-loading { display: grid; min-height: 100dvh; place-content: center; padding: 1rem; box-sizing: border-box; font: 1rem system-ui; overflow-wrap: anywhere; }
    </style>
    <script>
      (function () {
        var stored; try { stored = localStorage.getItem("pulsy-theme"); } catch (e) {}
        var dark = stored === "dark" || (stored !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <script src="/locale-bootstrap.js"></script>
	</head>
	<body>
		<div id="locale-loading" role="status" hidden>Pulsy</div>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
