# ============================================
# Pulsy — shared http-level config (loaded once)
# ============================================
# Install to /etc/nginx/conf.d/pulsy-shared.conf so it loads inside the main
# `http {}` block. It defines the upstreams, the websocket upgrade map, and the
# rate-limit zones ONCE, so both the primary `pulsy.example.com` vhost AND every
# auto-generated custom-domain vhost (pulsy-custom-<domain>) can reference them
# without nginx "duplicate upstream / duplicate zone" errors.
#
# When installing: REMOVE these same blocks from the existing pulsy.example.com
# vhost file (they move here). See ops/custom-domains/README.md.

upstream pulsy_web {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream pulsy_server {
    server 127.0.0.1:4000;
    keepalive 64;
}

# WebSocket / connection-upgrade map.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate-limiting zones (shared across all Pulsy vhosts).
limit_req_zone $binary_remote_addr zone=pulsy_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=pulsy_auth_limit:10m rate=5r/s;
