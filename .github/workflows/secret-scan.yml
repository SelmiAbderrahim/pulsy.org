name: Secret scan

on:
  push:
    branches: [main, master, oss]
  pull_request:
    branches: [main, master, oss]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # gitleaks runs from its own pinned image rather than gitleaks-action so
      # the scan covers every reachable commit. The action scans the push range
      # as `<before>^..<after>`; this repository's root commit is an orphan, so
      # that range is an unknown revision and the scan aborts with exit code 1
      # having read nothing. Rules and allowlists come from .gitleaks.toml.
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            --entrypoint gitleaks \
            zricethezav/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 \
            git . --log-opts=--all --redact --exit-code 1 \
            --report-format sarif --report-path gitleaks-results.sarif

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gitleaks-results-${{ github.sha }}
          path: gitleaks-results.sarif
          if-no-files-found: warn
          retention-days: 14
