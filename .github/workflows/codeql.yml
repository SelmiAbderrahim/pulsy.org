name: CodeQL

on:
  push:
    branches: [main, master, oss]
  pull_request:
    branches: [main, master, oss]
  schedule:
    # Weekly sweep so newly-published queries run against unchanged code too.
    - cron: "23 4 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL analysis
        id: analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          category: "/language:javascript-typescript"
          output: codeql-results
          # Personal private repositories cannot upload to GitHub Code Scanning.
          upload: ${{ github.repository_visibility == 'public' && 'always' || 'never' }}

      - name: Retain CodeQL results for private repositories
        if: ${{ github.repository_visibility != 'public' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: codeql-results-${{ github.sha }}
          path: ${{ steps.analyze.outputs.sarif-output }}
          if-no-files-found: error
          retention-days: 14
