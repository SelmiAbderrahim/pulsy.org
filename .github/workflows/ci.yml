name: CI

on:
  push:
    branches: [main, master, oss]
  pull_request:
    branches: [main, master, oss]

# Avoid wasting runners on superseded pushes to the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VITE_SOURCE_CODE_URL: https://github.com/${{ github.repository }}/tree/${{ github.sha }}

jobs:
  build:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Configure disposable local services
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cp .env.example .env
          sed -i \
            -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 24)|" \
            -e "s|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=$(openssl rand -hex 32)|" \
            -e "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=$(openssl rand -hex 32)|" \
            -e 's|^REQUIRE_EMAIL_VERIFICATION=.*|REQUIRE_EMAIL_VERIFICATION=false|' \
            .env

      - name: Build and start test infrastructure
        run: make test-infrastructure

      - name: Audit production dependencies
        run: docker compose -f docker/docker-compose.yml --env-file .env exec -T server pnpm audit --prod --audit-level high

      - name: Typecheck
        run: make typecheck

      - name: Test
        run: make test

      - name: Build images (including native web tests)
        run: make build

      - name: Remove disposable services
        if: always()
        run: docker compose -f docker/docker-compose.yml --env-file .env down --volumes --remove-orphans

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Build context is the repository root for both images. The server image
      # is built at the `prod` target — the artifact that ships to GHCR.
      - name: Build server image (prod target)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.server
          target: prod
          push: false
          tags: pulsy-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: false
          tags: pulsy-web:ci
          build-args: |
            VITE_SOURCE_CODE_URL=https://github.com/${{ github.repository }}/tree/${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  eslint:
    name: ESLint and policy regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Configure disposable local services
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cp .env.example .env
          sed -i \
            -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 24)|" \
            -e "s|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=$(openssl rand -hex 32)|" \
            -e "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=$(openssl rand -hex 32)|" \
            -e 's|^REQUIRE_EMAIL_VERIFICATION=.*|REQUIRE_EMAIL_VERIFICATION=false|' \
            .env

      - name: Build and start test infrastructure
        run: make test-infrastructure

      - name: Run eslint-check
        run: make eslint-check

      - name: Remove disposable services
        if: always()
        run: docker compose -f docker/docker-compose.yml --env-file .env down --volumes --remove-orphans

  translations:
    name: Translation integrity and regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Configure disposable local services
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cp .env.example .env
          sed -i \
            -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 24)|" \
            -e "s|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=$(openssl rand -hex 32)|" \
            -e "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=$(openssl rand -hex 32)|" \
            -e 's|^REQUIRE_EMAIL_VERIFICATION=.*|REQUIRE_EMAIL_VERIFICATION=false|' \
            .env

      - name: Build and start test infrastructure
        run: make test-infrastructure

      - name: Run translations-check
        run: make translations-check

      - name: Remove disposable services
        if: always()
        run: docker compose -f docker/docker-compose.yml --env-file .env down --volumes --remove-orphans

  agent:
    name: Agent checks and installation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Configure disposable local services
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cp .env.example .env
          sed -i \
            -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 24)|" \
            -e "s|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=$(openssl rand -hex 32)|" \
            -e "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=$(openssl rand -hex 32)|" \
            -e 's|^REQUIRE_EMAIL_VERIFICATION=.*|REQUIRE_EMAIL_VERIFICATION=false|' \
            .env

      - name: Vet and test the agent
        run: make agent-check

      - name: Test the actual systemd installer
        run: make agent-install-check

      - name: Test the installer-generated Compose agent
        run: make agent-compose-check

  server-health-e2e:
    name: Installed-agent server health acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Configure disposable local services
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cp .env.example .env
          sed -i \
            -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 24)|" \
            -e "s|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=$(openssl rand -hex 32)|" \
            -e "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=$(openssl rand -hex 32)|" \
            -e 's|^REQUIRE_EMAIL_VERIFICATION=.*|REQUIRE_EMAIL_VERIFICATION=false|' \
            .env

      - name: Exercise the installed-agent lifecycle
        run: make server-health-e2e

      - name: Retain redacted installed-agent evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: server-health-evidence-${{ github.sha }}
          path: artifacts/server-health-e2e/
          if-no-files-found: warn
          retention-days: 14
