# NOTE on add_header inheritance: a location with its own add_header directive
# does NOT inherit server-level add_header lines, so the security header block
# is repeated in every static location. HSTS belongs on the TLS-terminating
# reverse proxy in front of this container, not here (this vhost is plain HTTP).

server {
	# 8080: the runtime image is nginx-unprivileged (non-root cannot bind 80).
	listen 8080;
	server_name _;
	# Relative Location headers — this container always sits behind a host port
	# mapping or reverse proxy, so its internal port must never leak into
	# redirects generated for directory-style paths.
	absolute_redirect off;
	root /usr/share/nginx/html;
	index index.html;

	# Compress text assets and API responses, including retained lazy chunks.
	gzip on;
	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 5;
	gzip_min_length 1024;
	gzip_types text/css text/javascript application/javascript application/json application/yaml application/xml image/svg+xml text/plain;

	# Built Vite assets are content-hashed. Missing old chunks must fail loudly
	# if neither this image nor the retained volume has them.
	location ^~ /assets/ {
		try_files $uri @retained_assets;
		add_header Cache-Control "public, max-age=31536000, immutable";
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
		add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
	}

	location @retained_assets {
		root /var/cache/pulsy;
		try_files $uri =404;
		add_header Cache-Control "public, max-age=31536000, immutable";
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
		add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
	}

	location = /openapi.yaml {
		default_type application/yaml;
		try_files $uri =404;
		add_header Cache-Control "no-cache";
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
		add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
	}

	# SPA fallback — every non-asset path serves index.html.
	location / {
		try_files $uri $uri/ /index.html;
		add_header Cache-Control "no-cache";
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
		# img allows https: because status pages may reference operator-supplied
		# logo URLs. style 'unsafe-inline' covers library-injected <style> tags.
		add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
	}

	# Proxy API + auth to the server container (same-origin for cookies).
	# Security headers on these responses are set by the Express app itself.
	# Capability URLs must not appear in access or upstream error logs.
	location ~* ^/api/heartbeat(?:/|$) {
		access_log off;
		error_log /dev/null crit;
		proxy_pass http://server:4000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection "";
		proxy_buffering off;
	}

	location /api/ {
		proxy_pass http://server:4000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		# better-auth + tRPC stream-friendly settings
		proxy_set_header Connection "";
		proxy_buffering off;
	}

	location = /health {
		proxy_pass http://server:4000/health;
	}
}
