name: pulsy

services:
  postgres:
    image: postgres:16-alpine
    container_name: pulsy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulsy}
      # No default on purpose: compose fails fast instead of booting a
      # world-guessable pulsy/pulsy database. Set it in the root .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pulsy}
    ports:
      # Loopback-only: the server reaches Postgres over the compose network;
      # the host mapping exists purely for local inspection (make shell-postgres).
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pulsy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulsy} -d ${POSTGRES_DB:-pulsy}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
      # dev target keeps vitest/tsc available for `make test`/`make typecheck`;
      # the published GHCR image is built from the lean `prod` target.
      target: dev
    container_name: pulsy-server
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      # Override DB host so the server reaches the compose postgres service.
      DATABASE_URL: postgres://${POSTGRES_USER:-pulsy}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — set it in .env}@postgres:5432/${POSTGRES_DB:-pulsy}
      SERVER_PORT: "4000"
    expose:
      - "4000"
    ports:
      # Loopback-only: browsers reach the API through the web container's
      # nginx (/api/*); the host mapping exists for local tooling only.
      - "127.0.0.1:${SERVER_PORT:-4000}:4000"
    healthcheck:
      # node:slim ships no curl/wget — use Node's global fetch.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        # Baked into the bundle by Vite at build time.
        VITE_SERVER_URL: ${VITE_SERVER_URL:-}
        # The app's own canonical host. Any OTHER host the browser is on is
        # treated as a custom status-page domain (getCustomStatusDomain). Must
        # be set for custom domains to render their status page.
        VITE_APP_URL: ${VITE_APP_URL:-}
        # Routing target shown to users attaching a custom domain (CNAME/A).
        VITE_CUSTOM_DOMAIN_CNAME_TARGET: ${CUSTOM_DOMAIN_CNAME_TARGET:-}
        VITE_CUSTOM_DOMAIN_IP: ${CUSTOM_DOMAIN_IP:-}
        # Free-text notice on the login page (demo instances).
        VITE_DEMO_NOTICE: ${VITE_DEMO_NOTICE:-}
        # Public corresponding source for this exact deployed build.
        VITE_SOURCE_CODE_URL: ${VITE_SOURCE_CODE_URL:-https://github.com/SelmiAbderrahim/pulsy}
    container_name: pulsy-web
    volumes:
      - web_assets:/var/cache/pulsy
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      # Not used by nginx at runtime; surfaced for inspection/parity.
      VITE_SERVER_URL: ${VITE_SERVER_URL:-}
    ports:
      # Container listens on 8080 (unprivileged nginx).
      - "${WEB_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pulsy_pgdata:
  web_assets:
